# Docs for the Azure Functions action:
# https://github.com/Azure/functions-action

name: Build and deploy Azure Functions - ai-academy-progress-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend/ai-academy-functions'
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Install dependencies in the correct Azure Functions folder
      - name: Install Azure Functions dependencies
        run: npm install
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # 4. Build if a build script exists
      - name: Build Azure Functions project
        run: npm run build --if-present
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # 5. Run tests if a test script exists
      - name: Test Azure Functions project
        run: npm test --if-present
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # 6. Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6657F14EF0D54EEABFD964D68FFFAE4E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_591A10D706C4416B82C01BA2F6A80A5A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9F17534FFB4E4F6C9FE6DC45C61BFFD4 }}

      # 7. Deploy Azure Functions
      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'ai-academy-progress-api'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
