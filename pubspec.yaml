name: ai_academy
description: A fully featured AI-powered learning app
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  http: ^1.2.0
  get: ^4.6.6
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0

  # Authentication (Microsoft Entra / OpenID Connect)

  # Media & Web
  video_player: ^2.8.2
  chewie: ^1.7.4

  # Voice features
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # PDF export
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter_widget_from_html_core: ^0.17.4
  crypto: ^3.0.7
  web: ^1.1.1
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  markdown: ^7.3.1
  url_launcher: ^6.3.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/courses/
# App icons — regenerate with: dart run flutter_launcher_icons
# (source art is drawn by tool/brand/make_logo.py)
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/brand/app_icon.png"
    background_color: "#0B3D2E"
    theme_color: "#0B3D2E"

# Launch screen — regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B3D2E"
  image: "assets/brand/splash_logo.png"
  android_12:
    color: "#0B3D2E"
    image: "assets/brand/splash_logo_android12.png"
  web: true
